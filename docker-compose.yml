# Local development stack: Postgres + the Spring Boot API.
#   docker compose up -d postgres   # database only (run the API from your IDE)
#   docker compose up --build       # database + API on http://localhost:8080
# Values come from .env (copy .env.example to .env first).
name: drivon

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drivon}
      POSTGRES_USER: ${POSTGRES_USER:-drivon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-drivon}
      DB_USERNAME: ${POSTGRES_USER:-drivon}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  postgres-data:
