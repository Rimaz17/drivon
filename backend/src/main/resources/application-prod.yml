# Production (Render + Neon). Every value comes from the environment; there are
# deliberately no defaults so a missing variable fails fast at startup.
# DB_URL must include sslmode=require for Neon.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Neon autosuspends; retire connections before its idle timeout closes them.
      max-lifetime: 240000
      keepalive-time: 60000

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO

drivon:
  storage:
    # Required in production; no defaults, so a missing variable fails startup.
    r2:
      account-id: ${R2_ACCOUNT_ID}
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
      bucket: ${R2_BUCKET}
