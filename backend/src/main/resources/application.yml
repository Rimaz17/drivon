spring:
  application:
    name: drivon-api
  profiles:
    default: dev
  jpa:
    # Schema is owned by Flyway; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      # Neon's free tier allows few connections; keep the pool small.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  data:
    web:
      pageable:
        # Matches SortOptions.MAX_PAGE_SIZE; larger requests are capped, not rejected.
        default-page-size: 20
        max-page-size: 100

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Drivon API
    version: '@project.version@'

logging:
  pattern:
    # requestId is put into the MDC by RequestIdFilter.
    correlation: '[%X{requestId:-}] '

drivon:
  security:
    jwt:
      issuer: drivon-api
      # Required in every environment; deliberately no default here.
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    # Per client IP: 10 register/login attempts, refilled over a minute.
    auth-rate-limit:
      capacity: 10
      refill-period: 1m
