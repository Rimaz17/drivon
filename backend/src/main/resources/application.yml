spring:
  application:
    name: drivon-api
  profiles:
    default: dev
  jpa:
    # Schema is owned by Flyway; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      # Neon's free tier allows few connections; keep the pool small.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  data:
    web:
      pageable:
        # Matches SortOptions.MAX_PAGE_SIZE; larger requests are capped, not rejected.
        default-page-size: 20
        max-page-size: 100

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Drivon API
    version: '@project.version@'

logging:
  pattern:
    # requestId is put into the MDC by RequestIdFilter.
    correlation: '[%X{requestId:-}] '

drivon:
  security:
    jwt:
      issuer: drivon-api
      # Required in every environment; deliberately no default here.
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    # Per client IP: 10 register/login attempts, refilled over a minute.
    auth-rate-limit:
      capacity: 10
      refill-period: 1m
  storage:
    # Cloudflare R2 for vehicle documents. Optional outside production: without
    # these, the API starts and document endpoints answer STORAGE_UNAVAILABLE.
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      upload-url-ttl: 10m
      download-url-ttl: 5m
  notifications:
    firebase:
      # Base64 of the Firebase service account JSON. Optional outside production:
      # without it, reminders are only shown in the app (no push notifications).
      service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
  assistant:
    # Ask My Vehicle. Keys are optional outside production: without them the
    # chat endpoint answers ASSISTANT_UNAVAILABLE. The other provider takes over
    # when the primary one fails (docs/adr/0014-ask-my-vehicle.md).
    primary: GEMINI
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
      base-url: https://generativelanguage.googleapis.com/v1beta
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:openai/gpt-oss-120b}
      base-url: https://api.groq.com/openai/v1
    call-timeout: 25s
    # Below the app's 70-second receive timeout.
    total-timeout: 60s
    max-tool-rounds: 5
    # Per user: 30 questions, refilled over a day, to stay inside free quotas.
    rate-limit:
      capacity: 30
      refill-period: 24h
  reminders:
    # Shared secret of POST /internal/reminders/run (the daily reminders workflow).
    # Without it the endpoint is switched off.
    job-secret: ${REMINDERS_JOB_SECRET:}
