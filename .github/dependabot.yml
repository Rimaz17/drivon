version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(backend)"

  - package-ecosystem: pub
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # flutter_localizations pins intl exactly for each Flutter SDK; intl moves
      # only when Flutter is upgraded.
      - dependency-name: intl
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(frontend)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # The project is pinned to Java 17; only take 17.x patch images.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(backend)"
