name: drivon
description: "Drivon: personal vehicle companion"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  # The exact Flutter version (3.44.7) is pinned in CI; see README.
  flutter: ">=3.44.7"

# Versions are pinned exactly; Dependabot proposes upgrades as PRs.
dependencies:
  dio: 5.11.1
  file_selector: 1.1.0
  fl_chart: 1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_image_compress: 2.5.1
  flutter_secure_storage: 11.2.0
  freezed_annotation: 3.1.0
  go_router: 18.0.2
  image_picker: 1.2.3
  # Must match the version flutter_localizations pins for this Flutter SDK.
  intl: 0.20.2
  json_annotation: 4.12.0
  shared_preferences: 2.5.6
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  # freezed 4.x needs Dart 3.13; 3.2.5 pins analyzer <11, which caps build_runner at 2.15.x.
  build_runner: 2.15.1
  freezed: 3.2.5
  json_serializable: 6.14.1

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Hanken Grotesk 3.014, SIL Open Font License (assets/fonts/hanken_grotesk/OFL.txt).
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-Bold.ttf
          weight: 700
