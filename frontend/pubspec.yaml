name: drivon
description: "Drivon: personal vehicle companion"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  # The exact Flutter version (3.44.7) is pinned in CI; see README.
  flutter: ">=3.44.7"

# Versions are pinned exactly; Dependabot proposes upgrades as PRs.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  # Must match the version flutter_localizations pins for this Flutter SDK.
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
