name: drivon
description: "Drivon: personal vehicle companion"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  # The exact Flutter version (3.44.7) is pinned in CI; see README.
  flutter: ">=3.44.7"

# Versions are pinned exactly; Dependabot proposes upgrades as PRs.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  # Must match the version flutter_localizations pins for this Flutter SDK.
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Hanken Grotesk 3.014, SIL Open Font License (assets/fonts/hanken_grotesk/OFL.txt).
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/hanken_grotesk/HankenGrotesk-Bold.ttf
          weight: 700
